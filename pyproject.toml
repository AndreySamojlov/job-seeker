[project]
name = "job-machine"
version = "0.1.0"
description = "Semi-autonomous job application machine"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pypdf>=6.14.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
worker = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "playwright==1.49.*",
    "pydantic>=2",
    "httpx>=0.27",
]
mcp = [
    "mcp>=1.2",
    "httpx>=0.27",
    "openpyxl>=3.1",
]
sourcing = [
    "python-jobspy>=1.1",
    "pandas>=2",
    "pydantic>=2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# importlib-режим: разрешает одноимённые тест-файлы в разных папках
# (tests/test_schema.py и tests/browser/test_schema.py) без __init__.py.
addopts = "--import-mode=importlib"
markers = [
    "db: integration test requiring a live Postgres (run with -m db)",
    "browser: integration test requiring a real Chromium (run with -m browser)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_machine"]
