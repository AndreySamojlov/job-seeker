<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Visible reCAPTCHA form</title></head>
<body>
  <h1>Apply</h1>
  <form id="application" method="post" action="/submitted">
    <label for="fn">Full name</label>
    <input id="fn" name="full_name" type="text" required>

    <label for="em">Email</label>
    <input id="em" name="email" type="email" required>

    <button type="submit">Submit Application</button>
  </form>

  <!-- Классический видимый reCAPTCHA v2 checkbox anchor: size=normal (нет invisible),
       должен по-прежнему детектироваться как реальный блокер. -->
  <div class="g-recaptcha-widget">
    <iframe
      src="https://recaptcha.invalid/recaptcha/api2/anchor?size=normal&k=fake"
      title="reCAPTCHA"
      width="304" height="78"></iframe>
  </div>
</body>
</html>
