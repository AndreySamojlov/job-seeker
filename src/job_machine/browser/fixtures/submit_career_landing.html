<body>
  <!-- Обычный карьерный лендинг: формы нет, невалидных контролов нет, а в
       абзаце «what happens next» стоит фраза, неотличимая от подтверждения по
       одному лишь тексту. Оборот "as soon as" не покрывается закрытым списком
       условных связок — потому несущей защитой служит место фразы: обещание
       живёт в абзаце, подтверждение — в заголовке. -->
  <h1>Careers at Example</h1>
  <h2>What happens next</h2>
  <p>As soon as we have received your application, a recruiter will be in touch
     to talk about the next steps.</p>
  <p>We review every application we get and aim to reply within two weeks.</p>
</body>
