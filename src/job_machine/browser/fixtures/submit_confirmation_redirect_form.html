<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sample Application (redirects to a confirmation page)</title></head>
<body>
  <h1>Apply: Sample Role</h1>
  <!-- Классическая ATS-форма: успешная отправка уводит на отдельную страницу
       подтверждения (URL меняется, формы там больше нет). Даёт доказательство
       вида confirmation_signal="confirmation_url". -->
  <form id="application" method="get" action="submit_confirmation_thank_you.html">
    <label for="full_name">Full name</label>
    <input id="full_name" name="full_name" type="text" required>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>

    <button type="submit">Submit Application</button>
  </form>
</body>
</html>
