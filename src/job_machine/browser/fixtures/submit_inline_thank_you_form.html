<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sample Application (in-place thank-you)</title></head>
<body>
  <h1>Apply: Sample Role</h1>
  <!-- React-style ATS (Greenhouse/Ashby): страница не перезагружается, форма
       заменяется благодарностью на месте. URL не меняется, поэтому единственное
       честное подтверждение — текст: confirmation_signal="thank_you_text". -->
  <form id="application" method="post" action="/submitted">
    <label for="full_name">Full name</label>
    <input id="full_name" name="full_name" type="text" required>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>

    <button type="submit">Submit Application</button>
  </form>
  <script>
    document.getElementById('application').addEventListener('submit', function (e) {
      // submit-событие срабатывает только после успешной нативной валидации
      e.preventDefault();
      var done = document.createElement('div');
      done.innerHTML =
        '<h1>Thank you for applying</h1>' +
        '<p>Your application has been submitted.</p>';
      e.target.replaceWith(done);
    });
  </script>
</body>
</html>
