<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sample Application (confirmation page has a job-alerts footer)</title></head>
<body>
  <h1>Apply: Sample Role</h1>
  <form id="application" method="get" action="submit_confirmation_with_job_alerts.html">
    <label for="full_name">Full name</label>
    <input id="full_name" name="full_name" type="text" required>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>

    <button type="submit">Submit Application</button>
  </form>
</body>
</html>
