<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sample Application (OneTrust cookie banner)</title></head>
<body>
  <form id="application" method="post" action="/submitted">
    <label for="full_name">Full name</label>
    <input id="full_name" name="full_name" type="text" required>
    <button type="submit">Submit Application</button>
  </form>

  <!-- Живой инцидент 17.07.2026 (Kaseya): именно эта структура (dark-filter поверх
       формы, position:fixed + z-index) перехватывала клик по submit 30с до
       таймаута Playwright. -->
  <div data-nosnippet="true" id="onetrust-consent-sdk">
    <div class="onetrust-pc-dark-filter ot-fade-in"
         style="position:fixed;top:0;left:0;width:100%;height:100%;
                background:rgba(0,0,0,0.5);z-index:9999;"></div>
    <div id="onetrust-banner-sdk"
         style="position:fixed;bottom:0;left:0;width:100%;z-index:10000;
                background:#fff;padding:20px;">
      <p>We use cookies to improve your experience.</p>
      <button id="onetrust-reject-all-handler">Reject All</button>
      <button id="onetrust-accept-btn-handler">Accept All</button>
    </div>
  </div>
  <script>
    // Как реальный OneTrust: выбор reject/accept убирает баннер из DOM.
    document.getElementById('onetrust-reject-all-handler').addEventListener('click', function () {
      document.getElementById('onetrust-consent-sdk').remove();
    });
    document.getElementById('onetrust-accept-btn-handler').addEventListener('click', function () {
      document.getElementById('onetrust-consent-sdk').remove();
    });
  </script>
</body>
</html>
